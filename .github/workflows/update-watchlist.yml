name: Update public watchlist

on:
  schedule:
    # Cada 30 minutos durante mercado argentino:
    # 10:35, 11:05, 11:35, 12:05, 12:35, 13:05, 13:35,
    # 14:05, 14:35, 15:05, 15:35, 16:05, 16:35 y 17:05 ART.
    - cron: "35 13 * * 1-5"
    - cron: "5,35 14-19 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update sanitized public prices
        id: update
        continue-on-error: true
        run: |
          node tools/update-watchlist.mjs

      - name: Commit if changed
        if: always()
        run: |
          if git diff --quiet -- data/watchlist.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          git commit -m "Update public watchlist prices"
          git push

      - name: Fail workflow if updater failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "El actualizador fallo, pero se intento publicar updateStatus=ERROR en data/watchlist.json."
          exit 1
